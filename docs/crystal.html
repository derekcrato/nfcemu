<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokemon Crystal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game">Carregando...</div>

    <script>
        const SAVE_KEY = 'nfc_save_crystal_gbc_v1';

        window.EJS_player = '#game';
        window.EJS_core = 'gambatte';
        window.EJS_pathtodata = './emulatorjs/data/';
        window.EJS_gameUrl = './roms/crystal-version.gbc';
        window.EJS_biosUrl = '';
        window.EJS_saveStateURL = '';
        window.EJS_loadStateURL = '';
        window.EJS_saveStateName = '';
        window.EJS_cheats = null;
        window.EJS_debug = false;
        window.EJS_language = 'pt-BR';
        window.EJS_gameID = 1;
        window.EJS_gameName = 'Pokemon Crystal';
        window.EJS_disableLocalStorage = false;
        window.EJS_defaultOptions = {
            'save-state-location': 'browser',
            'save-state-slot': 1
        };
        window.EJS_fixedSaveInterval = 5000;

        window.EJS_ready = function() {
            console.log('EVENTO READY:', window.EJS_emulator);
            if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                console.log('GAME MANAGER:', window.EJS_emulator.gameManager);
                console.log('GETSTATE:', window.EJS_emulator.gameManager.getState ? 'existe' : 'nao existe');
            }
        };

        window.EJS_onSaveUpdate = function(e) {
            console.log('EVENTO onSaveUpdate disparado:', e);
            if (!e || !e.save) return;
            try {
                const data = {
                    hash: e.hash || Date.now().toString(),
                    save: Array.from(new Uint8Array(e.save)),
                    screenshot: e.screenshot || null,
                    format: e.format || 'png',
                    date: new Date().toISOString()
                };
                localStorage.setItem(SAVE_KEY + '_battery', JSON.stringify(data));
                console.log('Bateria salva via onSaveUpdate');
            } catch (err) {
                console.error('Erro ao salvar bateria:', err);
            }
        };

        window.EJS_onSaveSave = function(e) {
            console.log('EVENTO onSaveSave disparado:', e);
            if (!e || !e.save) return;
            try {
                const data = {
                    state: Array.from(new Uint8Array(e.save)),
                    screenshot: e.screenshot || null,
                    format: e.format || 'png',
                    date: new Date().toISOString()
                };
                localStorage.setItem(SAVE_KEY + '_state', JSON.stringify(data));
                console.log('Save state salvo via onSaveSave');
            } catch (err) {
                console.error('Erro ao salvar state:', err);
            }
        };

        window.EJS_onLoadSave = function() {
            console.log('EVENTO onLoadSave disparado');
            const saved = localStorage.getItem(SAVE_KEY + '_state');
            if (!saved) {
                console.log('Nenhum save state encontrado');
                return;
            }
            try {
                const data = JSON.parse(saved);
                console.log('Save state carregado:', data.date);
            } catch (err) {
                console.error('Erro ao carregar save state:', err);
            }
        };

        window.EJS_onSaveState = function(e) {
            console.log('EVENTO onSaveState disparado:', e);
        };

        window.EJS_onLoadState = function(e) {
            console.log('EVENTO onLoadState disparado:', e);
        };

        window.EJS_onGameStart = function() {
            console.log('EVENTO onGameStart disparado');
            
            const batterySaved = localStorage.getItem(SAVE_KEY + '_battery');
            if (batterySaved) {
                try {
                    const data = JSON.parse(batterySaved);
                    console.log('Bateria anterior encontrada:', data.date);
                } catch (err) {
                    console.error('Erro ao ler bateria salva:', err);
                }
            }
        };

        window.EJS_onExit = function() {
            console.log('EVENTO onExit disparado');
        };
    </script>

    <script src="./emulatorjs/data/loader.js"></script>
</body>
</html>
