<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokemon Crystal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const SAVE_KEY = 'nfc_save_crystal_gbc_v1';
        const GAME_ID = 'pokemon-crystal-gbc';
        const USER_ID_KEY = 'nfc_user_id';
        
        let userId = localStorage.getItem(USER_ID_KEY);
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem(USER_ID_KEY, userId);
        }

        window.EJS_player = '#game';
        window.EJS_core = 'gambatte';
        window.EJS_pathtodata = './emulatorjs/data/';
        window.EJS_gameUrl = './roms/crystal-version.gbc';
        window.EJS_biosUrl = '';
        window.EJS_saveStateURL = '';
        window.EJS_loadStateURL = '';
        window.EJS_saveStateName = '';
        window.EJS_cheats = null;
        window.EJS_debug = false;
        window.EJS_language = 'pt-BR';
        window.EJS_gameID = 1;
        window.EJS_gameName = 'Pokemon Crystal';
        window.EJS_disableLocalStorage = false;
        window.EJS_defaultOptions = {
            'save-state-location': 'browser',
            'save-state-slot': 1
        };

        async function saveToGitHub(state) {
            try {
                const data = {
                    state: Array.from(new Uint8Array(state)),
                    date: new Date().toISOString(),
                    userId: userId
                };
                
                const response = await fetch('https://api.github.com/repos/derekcrato/nfcemu/actions/workflows/nfcemu-save.yml/dispatches', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            action: 'save',
                            userId: userId,
                            gameId: GAME_ID,
                            data: btoa(JSON.stringify(data))
                        }
                    })
                });
                
                if (response.ok) {
                    console.log('Save enviado para GitHub');
                } else {
                    console.error('Erro GitHub save:', response.status);
                }
            } catch (e) {
                console.error('Erro ao salvar:', e);
            }
        }

        async function loadFromGitHub() {
            try {
                const response = await fetch('https://api.github.com/repos/derekcrato/nfcemu/actions/workflows/nfcemu-save.yml/dispatches', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            action: 'load',
                            userId: userId,
                            gameId: GAME_ID
                        }
                    })
                });
                
                if (response.ok) {
                    console.log('Load GitHub solicitado');
                } else {
                    console.error('Erro GitHub load:', response.status);
                }
            } catch (e) {
                console.error('Erro ao carregar:', e);
            }
        }

        function getGameInstance() {
            return window.EJS_emulator && window.EJS_emulator.gameManager;
        }

        async function autoSave() {
            try {
                const gm = getGameInstance();
                if (!gm || !gm.getState) return;
                
                const state = gm.getState();
                if (!state) return;
                
                await saveToGitHub(state);
            } catch (e) {
                console.error('Auto-save erro:', e);
            }
        }

        window.EJS_onGameStart = async function() {
            console.log('Jogo iniciado');
            await loadFromGitHub();
            
            setInterval(autoSave, 10000);
        };

        window.EJS_ready = function() {
            console.log('Emulador pronto');
        };
    </script>

    <script src="./emulatorjs/data/loader.js"></script>
</body>
</html>
