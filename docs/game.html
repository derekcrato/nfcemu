<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100%; height: 100%; }
        #game iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div id="game">Carregando...</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rom = params.get('rom') || '/roms/crystal-version.gbc';
        const system = (params.get('system') || 'gbc').toLowerCase();

        const coreMap = {
            'gbc': 'gb',
            'gb': 'gb',
            'gba': 'gba',
            'nes': 'nes',
            'snes': 'snes',
            'n64': 'n64',
            'psx': 'psx',
            'ps1': 'psx',
            'genesis': 'segaMD',
            'segaMD': 'segaMD',
            'segacd': 'segaCD'
        };

        window.EJS_player = '#game';
        window.EJS_core = coreMap[system] || 'gb';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_gameUrl = rom;
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
