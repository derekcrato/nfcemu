<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game">Carregando...</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rom = params.get('rom') || '/roms/crystal-version.gbc';
        const system = (params.get('system') || 'gbc').toLowerCase();

        const coreMap = {
            'gbc': 'gambatte',
            'gb': 'gambatte',
            'gba': 'mgba',
            'nes': 'nestopia',
            'snes': 'snes9x',
            'n64': 'parallel_n64',
            'psx': 'mednafen_psx_hw',
            'ps1': 'mednafen_psx_hw',
            'genesis': 'genesis_plus_gx',
            'segaMD': 'genesis_plus_gx',
            'segacd': 'genesis_plus_gx'
        };

        window.EJS_player = '#game';
        window.EJS_core = coreMap[system] || 'gambatte';
        window.EJS_pathtodata = '/emulatorjs/data/';
        window.EJS_gameUrl = rom;
        window.EJS_biosUrl = '';
        window.EJS_saveStateURL = '';
        window.EJS_loadStateURL = '';
        window.EJS_saveStateName = '';
        window.EJS_cheats = null;
        window.EJS_debug = false;
        window.EJS_language = 'pt-BR';
    </script>

    <script src="/emulatorjs/data/loader.js"></script>
</body>
</html>
