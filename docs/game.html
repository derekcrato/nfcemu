<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokemon Crystal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        #game-container { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
        #game { width: 100%; height: 100%; }
        #game iframe, #game canvas { width: 100% !important; height: 100% !important; max-width: 100%; max-height: 100%; object-fit: contain; }
        #ui { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; justify-content: center; z-index: 100; pointer-events: none; }
        #ui > * { pointer-events: auto; }
        .btn { background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; backdrop-filter: blur(10px); }
        .btn:active { background: rgba(0,122,255,0.8); }
        #panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: none; z-index: 999; padding: 20px; overflow-y: auto; }
        #panel.active { display: block; }
        .panel-content { max-width: 500px; margin: 0 auto; padding-top: 50px; }
        .panel-content h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .slot { background: #222; border: 2px solid #333; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
        .slot:active { border-color: #007AFF; }
        .slot .num { font-size: 32px; font-weight: bold; color: #007AFF; }
        .slot .info { font-size: 11px; color: #888; margin-top: 5px; }
        .slot.empty .num { color: #555; }
        .slot-btns { margin-top: 10px; }
        .slot-btns button { padding: 6px 12px; font-size: 12px; margin: 2px; }
        #close-btn { position: fixed; top: 20px; right: 20px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game">Carregando emulador...</div>
    </div>

    <div id="ui">
        <button class="btn" id="save-btn">Salvar</button>
        <button class="btn" id="load-btn">Carregar</button>
    </div>

    <div id="panel">
        <button class="btn" id="close-btn">Fechar</button>
        <div class="panel-content">
            <h2 id="panel-title">Saves</h2>
            <div class="slots" id="slots"></div>
        </div>
    </div>

    <script>
        const romUrl = '/roms/crystal-version.gbc';
        const saveKey = 'nfc_save_crystal_gbc';

        window.EJS_player = '#game';
        window.EJS_core = 'gb';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_gameUrl = romUrl;
        window.EJS_biosUrl = '';
        window.EJS_saveStateURL = '';
        window.EJS_loadStateURL = '';
        window.EJS_saveStateName = '';
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <script>
        (function() {
            const panel = document.getElementById('panel');
            const slotsContainer = document.getElementById('slots');

            document.getElementById('save-btn').addEventListener('click', () => openPanel('save'));
            document.getElementById('load-btn').addEventListener('click', () => openPanel('load'));
            document.getElementById('close-btn').addEventListener('click', closePanel);

            function openPanel(mode) {
                document.getElementById('panel-title').textContent = mode === 'save' ? 'Salvar Jogo' : 'Carregar Jogo';
                renderSlots(mode);
                panel.classList.add('active');
            }

            function closePanel() {
                panel.classList.remove('active');
            }

            function getGame() {
                if (window.EJS && window.EJS.game) {
                    return window.EJS.game;
                }
                const iframe = document.querySelector('#game iframe');
                if (iframe && iframe.contentWindow && iframe.contentWindow.EJS) {
                    return iframe.contentWindow.EJS.game;
                }
                return null;
            }

            async function renderSlots(mode) {
                slotsContainer.innerHTML = '';

                for (let i = 1; i <= 8; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot empty';

                    const saved = localStorage.getItem(`${saveKey}_slot_${i}`);
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            slot.classList.remove('empty');
                            const date = new Date(data.date).toLocaleString('pt-BR');
                            slot.innerHTML = `
                                <div class="num">${i}</div>
                                <div class="info">${date}</div>
                                <div class="slot-btns">
                                    <button class="btn" data-slot="${i}" data-action="load">Carregar</button>
                                    <button class="btn btn-secondary" data-slot="${i}" data-action="delete">Excluir</button>
                                </div>
                            `;
                        } catch (e) {
                            console.error('Erro ao ler save:', e);
                        }
                    } else {
                        slot.innerHTML = `
                            <div class="num">${i}</div>
                            <div class="info">Vazio - toque para salvar</div>
                        `;
                        if (mode === 'save') {
                            slot.onclick = () => saveToSlot(i);
                        }
                    }

                    slotsContainer.appendChild(slot);
                }

                slotsContainer.querySelectorAll('button[data-action="load"]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        loadFromSlot(parseInt(btn.dataset.slot));
                    });
                });

                slotsContainer.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteSlot(parseInt(btn.dataset.slot));
                    });
                });
            }

            async function saveToSlot(slot) {
                try {
                    const game = getGame();
                    if (!game) {
                        alert('Emulador nao iniciado. Aguarde o jogo carregar.');
                        return;
                    }

                    let state = null;
                    if (game.exportState) {
                        state = game.exportState();
                    } else if (game.game && game.game.exportState) {
                        state = game.game.exportState();
                    }

                    if (!state) {
                        alert('Nao foi possivel exportar o save state.');
                        return;
                    }

                    const data = {
                        state: Array.from(state),
                        date: new Date().toISOString()
                    };

                    localStorage.setItem(`${saveKey}_slot_${slot}`, JSON.stringify(data));
                    alert(`Salvo no slot ${slot}`);
                    renderSlots('save');
                } catch (e) {
                    console.error('Erro ao salvar:', e);
                    alert('Erro ao salvar: ' + e.message);
                }
            }

            async function loadFromSlot(slot) {
                const saved = localStorage.getItem(`${saveKey}_slot_${slot}`);
                if (!saved) return alert('Slot vazio');

                try {
                    const data = JSON.parse(saved);
                    const game = getGame();
                    if (!game) {
                        alert('Emulador nao iniciado.');
                        return;
                    }

                    const state = new Uint8Array(data.state);

                    if (game.loadState) {
                        await game.loadState(state);
                    } else if (game.game && game.game.loadState) {
                        await game.game.loadState(state);
                    }

                    alert('Save carregado!');
                    closePanel();
                } catch (e) {
                    console.error('Erro ao carregar:', e);
                    alert('Erro ao carregar: ' + e.message);
                }
            }

            function deleteSlot(slot) {
                if (!confirm('Excluir este save?')) return;
                localStorage.removeItem(`${saveKey}_slot_${slot}`);
                renderSlots('save');
            }

            window.NFC_save = saveToSlot;
            window.NFC_load = loadFromSlot;
            window.NFC_delete = deleteSlot;
        })();
    </script>
</body>
</html>
