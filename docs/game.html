<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Emulator</title>
    <style>
        body, html { margin: 0; padding: 0; }
        #game-container { width: 100%; max-width: 800px; margin: 0 auto; aspect-ratio: 4/3; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game">Carregando emulador...</div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const romUrl = params.get('rom');
            
            if (!romUrl) {
                document.getElementById('game').innerHTML = '<div style="color:#ff5555;padding:20px;text-align:center">Parâmetro ?rom= faltando</div>';
                return;
            }

            const system = (params.get('system') || 'gbc').toLowerCase();
            const coreMap = {
                'gbc': 'gb',
                'gb': 'gb',
                'gba': 'gba',
                'nes': 'nes',
                'snes': 'snes',
                'n64': 'n64',
                'genesis': 'segaMD',
                'segaMD': 'segaMD',
                'segacd': 'segaCD'
            };
            const core = coreMap[system] || 'gb';

            window.EJS_player = '#game';
            window.EJS_core = core;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = romUrl;
        })();
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
