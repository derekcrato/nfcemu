<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Launcher</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    .btn { display: inline-block; padding: 12px 24px; background: #007AFF; color: white; text-decoration: none; border-radius: 8px; margin: 10px; }
    .hidden { display: none !important; }
    .error { color: #FF3B30; }
  </style>
</head>
<body>
  <div id="launcher-section">
    <h1>Instale o NFC Launcher</h1>
    <p>Para jogar, voce precisa instalar o NFC Launcher primeiro.</p>
    <a class="btn" id="download-android" href="https://github.com/derekcrato/nfcemu/releases/download/v1.0.0/nfc-launcher-android.apk" download>Baixar para Android</a>
    <a class="btn" id="download-ios" href="https://github.com/derekcrato/nfcemu/releases/download/v1.0.0/nfc-launcher-ios.ipa" download>Baixar para iOS</a>
    <p class="error" id="platform-error"></p>
  </div>

  <div id="game-section" class="hidden">
    <h1>Abrindo jogo...</h1>
    <p>Se nao abrir automaticamente, toque no botao abaixo.</p>
    <a class="btn" href="#" id="play-btn">Abrir Jogo</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('game');
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);

      const downloadAndroid = document.getElementById('download-android');
      const downloadIOS = document.getElementById('download-ios');
      const platformError = document.getElementById('platform-error');

      const androidUrl = 'https://github.com/derekcrato/nfcemu/releases/download/v1.0.0/nfc-launcher-android.apk';
      const iosUrl = 'https://github.com/derekcrato/nfcemu/releases/download/v1.0.0/nfc-launcher-ios.ipa';

      if (isAndroid) {
        downloadAndroid.href = androidUrl;
        downloadAndroid.setAttribute('download', 'nfc-launcher-android.apk');
        downloadAndroid.style.display = 'inline-block';
        downloadAndroid.removeAttribute('onclick');
        downloadIOS.style.display = 'none';
      } else if (isIOS) {
        downloadIOS.href = iosUrl;
        downloadIOS.setAttribute('download', 'nfc-launcher-ios.ipa');
        downloadIOS.style.display = 'inline-block';
        downloadIOS.removeAttribute('onclick');
        downloadAndroid.style.display = 'none';
      } else {
        downloadAndroid.href = androidUrl;
        downloadAndroid.setAttribute('download', 'nfc-launcher-android.apk');
        downloadIOS.href = iosUrl;
        downloadIOS.setAttribute('download', 'nfc-launcher-ios.ipa');
        platformError.textContent = 'Selecione seu sistema:';
      }

      if (!gameId) {
        document.getElementById('launcher-section').classList.remove('hidden');
        return;
      }

      const launcherScheme = 'com.nfc.launcher://play?game=' + encodeURIComponent(gameId);
      const playBtn = document.getElementById('play-btn');
      const gameSection = document.getElementById('game-section');
      const launcherSection = document.getElementById('launcher-section');

      playBtn.href = launcherScheme;

      gameSection.classList.remove('hidden');
      launcherSection.classList.add('hidden');

      setTimeout(function() {
        window.location.href = launcherScheme;
      }, 500);

      setTimeout(function() {
        if (document.hidden === false) {
          gameSection.classList.add('hidden');
          launcherSection.classList.remove('hidden');
        }
      }, 3000);
    })();
  </script>
</body>
</html>
