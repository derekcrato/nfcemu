name: Build Launchers

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher-android/**'
      - 'launcher-ios/**'
      - 'dist/games.json'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 26.1.10909125
      - name: Build Android Launcher
        run: |
          cd launcher-android
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-launcher-android
          path: launcher-android/app/build/outputs/apk/release/*.apk
          retention-days: 90

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Launcher
        run: |
          cd launcher-ios
          if [ -f NFCLauncher.xcodeproj ]; then
            xcodebuild -project NFCLauncher.xcodeproj \
              -scheme NFCLauncher \
              -configuration Release \
              -archivePath build/NFCLauncher.xcarchive \
              archive
            xcodebuild -exportArchive \
              -archivePath build/NFCLauncher.xcarchive \
              -exportPath build \
              -exportOptionsPlist App/ExportOptions.plist
          else
            echo "Xcode project not found, skipping"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-launcher-ios
          path: launcher-ios/build/*.ipa
          retention-days: 90

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare launcher files
        run: |
          mkdir -p release-files
          find artifacts -name '*.apk' -exec sh -c 'cp "$1" release-files/nfc-launcher-android.apk' _ {} \;
          find artifacts -name '*.ipa' -exec sh -c 'cp "$1" release-files/nfc-launcher-ios.ipa' _ {} \;
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launchers-${{ github.sha }}
          name: Launchers ${{ github.sha }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
