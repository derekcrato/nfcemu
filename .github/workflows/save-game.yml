name: Save Game Data
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'save or load'
        required: true
        type: choice
        options:
          - save
          - load
      userId:
        description: 'User ID'
        required: true
        type: string
      gameId:
        description: 'Game ID'
        required: true
        type: string
      data:
        description: 'Save data (base64)'
        required: false
        type: string
jobs:
  save-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save Data
        if: github.event.inputs.action == 'save'
        run: |
          mkdir -p saves/${{ github.event.inputs.gameId }}
          echo '${{ github.event.inputs.data }}' | base64 -d > saves/${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json
          git config user.name "Save Bot"
          git config user.email "bot@users.noreply.github.com"
          git add saves/${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json
          git commit -m "Save ${{ github.event.inputs.gameId }} ${{ github.event.inputs.userId }} ${{ github.run_id }}" || true
          git push
      - name: Load Data
        if: github.event.inputs.action == 'load'
        run: |
          if [ -f saves/${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json ]; then
            echo "data=$(base64 -w 0 saves/${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json)" >> $GITHUB_OUTPUT
          else
            echo "data=" >> $GITHUB_OUTPUT
          fi
      - name: Set Output
        id: result
        run: echo "::set-output name=value::${{ steps.save-load.outputs.data }}"
