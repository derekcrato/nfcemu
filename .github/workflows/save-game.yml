name: Save Game Data
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'save or load'
        required: true
        type: choice
        options:
          - save
          - load
      userId:
        description: 'User ID'
        required: true
        type: string
      gameId:
        description: 'Game ID'
        required: true
        type: string
      data:
        description: 'Save data (base64)'
        required: false
        type: string
jobs:
  save-load:
    runs-on: ubuntu-latest
    outputs:
      save_data: ${{ steps.result.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: derekcrato/nfcemu-saves
          token: ${{ secrets.NFCEMU_SAVES_TOKEN }}

      - name: Save Data
        if: github.event.inputs.action == 'save'
        run: |
          mkdir -p ${{ github.event.inputs.gameId }}
          echo '${{ github.event.inputs.data }}' | base64 -d > ${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json
          git config user.name "Save Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Save ${{ github.event.inputs.gameId }} ${{ github.event.inputs.userId }} ${{ github.run_number }}" || true
          git push

      - name: Load Data
        if: github.event.inputs.action == 'load'
        run: |
          if [ -f ${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json ]; then
            echo "data=$(base64 -w 0 ${{ github.event.inputs.gameId }}/${{ github.event.inputs.userId }}.json)" >> $GITHUB_OUTPUT
          else
            echo "data=" >> $GITHUB_OUTPUT
          fi
        id: load

      - name: Set Output
        id: result
        if: github.event.inputs.action == 'load'
        run: echo "data=${{ steps.load.outputs.data }}" >> $GITHUB_OUTPUT
